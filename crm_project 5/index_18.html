<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зарплата — сотрудники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#3d6cf0;
    --blue-dark:#2b52c9;
    --blue-soft:#dde6fd;
    --blue-soft-text:#1f3d94;
    --blue-soft-hover:#cddaf9;
    --ink:#1c2333;
    --ink-2:#333c50;
    --muted:#8890a3;
    --muted-2:#aeb4c4;
    --line:#e7e9f2;
    --line-2:#eef0f7;
    --bg:#eef1f8;
    --card:#ffffff;
    --danger:#e5484d;
    --danger-soft:#fdeaea;
    --green:#2fae67;
    --amber:#f5a524;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(20,25,45,.04), 0 10px 30px -12px rgba(20,25,45,.10);
    --shadow-pop: 0 10px 15px -3px rgba(20,25,45,.12), 0 4px 6px -4px rgba(20,25,45,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);}
  .page{max-width:1580px;margin:0 auto;padding:24px 28px 60px;}

  /* ---------- App shell: sidebar + topbar ---------- */
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:86px;flex:0 0 auto;background:#fff;border-right:1px solid var(--line);
    padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .sidebar-logo{width:36px;height:36px;border-radius:10px;background:var(--blue);margin-bottom:14px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;}
  .nav-item{
    width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 8px;
    border-radius:12px;color:var(--muted-2);cursor:pointer;font-size:10px;font-weight:600;text-align:center;
    line-height:1.15;position:relative;transition:.12s;
  }
  .nav-item svg{stroke:currentColor;}
  .nav-item:hover{background:var(--bg);color:var(--ink-2);}
  .nav-item.active{background:var(--blue-soft);color:var(--blue-soft-text);}
  .nav-item .nav-badge{
    position:absolute;top:1px;right:12px;background:var(--danger);color:#fff;font-size:9px;font-weight:800;
    border-radius:999px;min-width:14px;height:14px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  .main-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    height:56px;flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:flex-end;padding:0 24px;gap:8px;
  }
  .user-chip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;cursor:default;transition:.12s;}
  .user-chip:hover{background:var(--bg);}
  .user-chip .chev{color:var(--muted);flex:0 0 auto;}
  .user-chip .uname{font-size:13.5px;font-weight:600;color:var(--ink-2);}

  /* ---------- Toolbar ---------- */
  .toolbar{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:14px 16px;margin-bottom:16px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .info-dot{
    width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--muted);border:1px solid var(--line);cursor:default;position:relative;
  }
  .info-dot:hover{color:var(--blue);border-color:var(--blue-soft);}
  .info-dot .tip{
    position:absolute;top:120%;left:0;background:var(--ink);color:#fff;font-size:12px;line-height:1.4;
    padding:8px 10px;border-radius:8px;width:220px;opacity:0;pointer-events:none;transform:translateY(-4px);
    transition:.15s;z-index:30;box-shadow:var(--shadow-pop);
  }
  .info-dot:hover .tip{opacity:1;transform:translateY(0);}

  .field-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .spacer{flex:1 1 auto;}

  /* Employee custom select */
  .emp-select{position:relative;}
  .emp-select-btn{
    display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:7px 12px 7px 8px;cursor:pointer;min-width:220px;
    font-size:14px;font-weight:500;color:var(--ink-2);transition:.15s;
  }
  .emp-select-btn:hover{border-color:var(--muted-2);}
  .emp-select-btn.open{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,108,240,.13);}
  .emp-select-btn .placeholder{color:var(--muted);font-weight:500;}
  .emp-select-btn .chev{margin-left:auto;color:var(--muted);transition:.15s;flex:0 0 auto;}
  .emp-select-btn.open .chev{transform:rotate(180deg);}

  .avatar{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#fff;flex:0 0 auto;letter-spacing:.02em;
  }
  .avatar.sm{width:24px;height:24px;font-size:10px;}

  .emp-panel{
    position:absolute;top:calc(100% + 8px);left:0;width:290px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius-md);box-shadow:var(--shadow-pop);z-index:40;overflow:hidden;
    opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transition:.14s ease;
  }
  .emp-panel.show{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
  .emp-panel .search-box{padding:9px;border-bottom:1px solid var(--line-2);}
  .emp-panel .search-box input{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;
    font-family:inherit;outline:none;background:var(--bg);
  }
  .emp-panel .search-box input:focus{border-color:var(--blue);background:#fff;}
  .emp-list{max-height:300px;overflow-y:auto;padding:6px;}
  .emp-item{
    display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink-2);
  }
  .emp-item:hover{background:var(--bg);}
  .emp-item.active{background:var(--blue-soft);color:var(--blue-soft-text);font-weight:600;}
  .emp-item .check{margin-left:auto;color:var(--blue);flex:0 0 auto;display:none;}
  .emp-item.active .check{display:block;}
  .emp-empty{padding:18px 10px;text-align:center;color:var(--muted);font-size:13px;}

  /* Date fields */
  .date-field{position:relative;}
  .date-field input{
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px;font-size:14px;
    width:132px;font-family:inherit;color:var(--ink-2);cursor:pointer;background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="%238890a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>') no-repeat right 10px center;
    padding-right:32px;
  }
  .date-field input::placeholder{color:var(--muted-2);}
  .date-field input:focus, .date-field input.focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,108,240,.13);}

  .cal-pop{
    position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius-md);box-shadow:var(--shadow-pop);padding:14px;width:296px;z-index:50;
    opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transition:.14s ease;
  }
  .cal-pop.show{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head .cal-title{font-weight:700;font-size:14px;color:var(--ink);text-transform:capitalize;}
  .cal-nav{
    width:28px;height:28px;border-radius:50%;border:none;background:var(--bg);color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;
  }
  .cal-nav:hover{background:var(--blue-soft);color:var(--blue-soft-text);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--blue);opacity:.75;padding:4px 0 8px;text-transform:uppercase;letter-spacing:.02em;}
  .cal-day{
    height:32px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;
    cursor:pointer;color:var(--ink-2);transition:.1s;position:relative;
  }
  .cal-day:hover{background:var(--bg);}
  .cal-day.muted{color:var(--muted-2);}
  .cal-day.weekend{color:#d9704e;}
  .cal-day.muted.weekend{color:#ecc3ae;}
  .cal-day.today{font-weight:800;}
  .cal-day.today::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--blue);}
  .cal-day.selected{background:var(--blue);color:#fff;font-weight:700;}
  .cal-day.selected:hover{background:var(--blue-dark);}
  .cal-day.in-range{background:var(--blue-soft);border-radius:0;}
  .cal-foot{display:flex;justify-content:center;margin-top:10px;}
  .cal-today-btn{background:none;border:none;color:var(--blue);font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 10px;border-radius:7px;}
  .cal-today-btn:hover{background:var(--blue-soft);}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:7px;border:none;border-radius:var(--radius-sm);
    padding:9px 16px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.13s;
    white-space:nowrap;
  }
  .btn svg{flex:0 0 auto;}
  .btn-primary{background:var(--blue);color:#fff;box-shadow:0 2px 6px -1px rgba(61,108,240,.45);}
  .btn-primary:hover{background:var(--blue-dark);box-shadow:0 4px 10px -1px rgba(61,108,240,.5);}
  .btn-soft{background:var(--blue-soft);color:var(--blue-soft-text);}
  .btn-soft:hover{background:var(--blue-soft-hover);}
  .btn:active{transform:translateY(1px);}

  .chip-btn{
    background:#fff;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;
    padding:8px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.13s;
  }
  .chip-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);}

  .icon-btn{
    width:37px;height:37px;border-radius:var(--radius-sm);border:1px solid var(--line);background:#fff;
    color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.13s;flex:0 0 auto;
  }
  .icon-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft);}

  /* Toast */
  .toast-wrap{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{
    background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;
    box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:9px;
    animation:toastIn .18s ease;
  }
  .toast.success svg{color:#5fd68f;}
  @keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

  /* Table */
  .table-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:16px;
  }
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);background:#fafbfd;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  thead th.num{text-align:right;}
  thead th.sortable{cursor:pointer;user-select:none;transition:.12s;}
  thead th.sortable:hover{color:var(--ink-2);}
  thead th.sort-active{color:var(--blue);}
  .sort-ico{display:inline-block;margin-left:3px;font-size:9px;opacity:.4;letter-spacing:0;}
  th.sort-active .sort-ico{opacity:1;}
  tbody td{padding:0;border-bottom:1px solid var(--line-2);vertical-align:middle;}
  tbody tr:hover{background:#fafbff;}
  tbody tr:last-child td{border-bottom:none;}
  td .cell-pad{padding:9px 14px;display:flex;align-items:center;gap:6px;min-height:20px;}
  td.num .cell-pad{justify-content:flex-end;}

  .cell-input{
    border:1px solid transparent;background:transparent;font-family:inherit;font-size:13.5px;color:var(--ink-2);
    width:100%;padding:5px 7px;border-radius:7px;cursor:default;outline:none;
  }
  .cell-input.num{text-align:right;font-variant-numeric:tabular-nums;}
  .cell-input:read-only{cursor:default;}
  .cell-input:read-only:hover{background:var(--bg);}
  .cell-input.editing{
    border:none;border-bottom:2px solid var(--blue);border-radius:2px 2px 0 0;
    background:rgba(61,108,240,.06);box-shadow:none;cursor:text;
  }
  .percent-wrap{display:flex;align-items:center;gap:2px;justify-content:flex-end;}
  .percent-wrap .cell-input{width:34px;min-width:34px;text-align:right;padding:5px 2px;flex:0 0 auto;}
  .percent-sign{color:var(--muted);font-size:13px;}

  .date-cell{cursor:pointer;font-size:13.5px;color:var(--ink-2);padding:5px 7px;border-radius:7px;border:1px solid transparent;display:inline-flex;}
  .date-cell:hover{background:var(--bg);}

  .link-ico{color:var(--muted-2);flex:0 0 auto;cursor:pointer;}
  .link-ico:hover{color:var(--blue);}
  .proj-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;}
  .emp-name{font-size:13.5px;color:var(--ink-2);white-space:nowrap;}

  .row-x{
    width:26px;height:26px;border-radius:7px;border:none;background:transparent;color:var(--muted-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;
  }
  .row-x:hover{background:var(--danger-soft);color:var(--danger);}

  .empty-state{padding:56px 20px;text-align:center;color:var(--muted);}
  .empty-state svg{color:var(--muted-2);margin-bottom:10px;}
  .empty-state div{font-size:14px;font-weight:500;}

  .subtotal-row td{background:#fafbfd;font-weight:700;font-size:13.5px;color:var(--ink);border-top:1px solid var(--line);border-bottom:none;}
  .subtotal-row td .cell-pad{padding:11px 14px;}

  /* Footer summary card */
  .summary-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);padding:18px 20px;
  }
  .extra-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
  .extra-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;}
  .input-suffix-wrap{position:relative;}
  .extra-field input{
    width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 30px 9px 11px;font-family:inherit;
    font-size:14px;color:var(--ink-2);background:var(--bg);transition:.13s;text-align:right;font-variant-numeric:tabular-nums;
  }
  .extra-field input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(61,108,240,.13);}
  .input-suffix-wrap .suffix{
    position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-weight:600;pointer-events:none;
  }

  .grand-total{
    display:flex;align-items:stretch;justify-content:flex-end;gap:12px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap;
  }
  .gt-chip{
    display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;
    background:var(--bg);border-radius:12px;padding:10px 18px;min-width:118px;
  }
  .gt-chip .gt-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .gt-chip .gt-val{font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .gt-chip.main{background:var(--blue-soft);}
  .gt-chip.main .gt-label{color:var(--blue-soft-text);opacity:.75;}
  .gt-chip.main .gt-val{color:var(--blue-soft-text);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#d7dbe6;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

      Выезды водителей
    </div>
    <div class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
      Дашборд

<script>
(function(){
  "use strict";

  /* ---------------- Data ---------------- */
  var PALETTE = ['#c15a34','#4f7fe0','#3ba876','#8b6fe0','#d9668c','#2a9d9d','#d1a13a','#5c8fd6'];

  function initials(name){
    var parts = name.trim().split(/\s+/);
    return ((parts[0]||'')[0]||'') + ((parts[1]||'')[0]||'');
  }
  function colorFor(name){
    var sum=0; for(var i=0;i<name.length;i++) sum+=name.charCodeAt(i);
    return PALETTE[sum % PALETTE.length];
  }
  var EMPLOYEES = EMP_NAMES.map(function(n){ return {name:n, initials:initials(n).toUpperCase(), color:colorFor(n)}; });

  function fmt1(n){
    var v = Math.round(n*10)/10;
    var s = v.toFixed(1).replace('.', ',');
    var parts = s.split(',');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return parts.join(',');
  }
  function parseNum(v){
    if(typeof v === 'number') return v;
    v = (v||'').toString().replace(/\s/g,'').replace(',', '.');
    var n = parseFloat(v);
    return isNaN(n)?0:n;
  }

  // Real dataset for Потапов Денис — matches the reference screenshot exactly
  var POTAPOV_ROWS = [
    ['22.07.2026','АО «АВИЛОН АГ»','Тех обслуживание 04.2026 / Авилон / Офис',100,2000,2000,0],

    ['01.07.2026','АО «АВИЛОН АГ»','06.2026 / Монтаж вентиляции / Авилон Цех 1',100,31240,31240,0],
    ['15.07.2026','АО «АВИЛОН АГ»','06.2026 / Монтаж вентиляции / Авилон Цех 2',100,6000,6000,0],

    ['29.07.2026','АО «АВИЛОН АГ»','07.2026 / ТО сплитов Черри / Волжская 12',60,24639,14783.4,0],
    ['29.07.2026','АО «АВИЛОН АГ»','07.2026 / ТО Сплитов и чиллеров / Блок А',60,10080,6048,0],

    ['08.07.2026','ООО «Состра»','05.2026 / ТО сплит-систем / Москва Сити',100,6000,6000,0],
    ['15.07.2026','ООО «МедКлиника Пресня»','05.2026 / Диагностика клапанов / Пресня',100,3000,3000,0],

    ['08.07.2026','ООО УК «АНТОРИЯ»','07.2026 / Ремонт ХМ1 замена ТРВ / Антория',100,7637.9,7637.9,0],
    ['08.07.2026','ООО УК «АНТОРИЯ»','07.2026 / Ремонт ХМ2 замена ТРВ / Антория',100,7581.8,7581.8,0],
    ['08.07.2026','ООО УК «АНТОРИЯ»','07.2026 / Замена вентилятора / Антория',100,1650,1650,0],
    ['15.07.2026','ООО «Вишневый Сад»','07.2026 / Ремонт ВРФ / Вишнёвый Сад',100,6000,6000,0],

    ['22.07.2026','ООО «АйТи Лайн»','07.2026 / Монтаж 2-х сплитов / Смарт Офис',100,17000,17000,0],
    ['28.07.2026','ООО «АйТи Лайн»','07.2026 / Демонтаж/Монтаж Дайкин',100,6000,6000,0],
    ['29.07.2026','ООО «Пехорский текстиль»','07.2026 / Утечка на ККБ / Пехорский текстиль',100,10262,10262,0],
    ['29.07.2026','ООО «ИЗУМРУД»','07.2026 / ТО сплит-систем / Изумруд',100,9000,9000,0]
  ];

  var CONTRACTOR_POOL = ['ООО «Комфорт Климат»','АО «ТеплоСервис»','ООО «Вент Инжиниринг»','ИП Смирнов А.В.','ООО «Холод Плюс»','АО «Микроклимат»','ООО «Инженер Сервис»'];
  var PROJECT_POOL = ['ТО сплит-систем','Монтаж вентиляции','Ремонт чиллера','Диагностика оборудования','Монтаж кондиционера','Замена фреона'];

  function seededRand(seed){
    var s = 0; for(var i=0;i<seed.length;i++) s = (s*31 + seed.charCodeAt(i)) >>> 0;
    return function(){ s = (s*1103515245 + 12345) >>> 0; return (s % 10000)/10000; };
  }
  function mockRowsFor(name){
    var rnd = seededRand(name);
    var count = 3 + Math.floor(rnd()*4);
    var rows = [];
    for(var i=0;i<count;i++){
      var day = 2 + Math.floor(rnd()*27);
      var date = (day<10?'0'+day:day) + '.07.2026';
      var contractor = CONTRACTOR_POOL[Math.floor(rnd()*CONTRACTOR_POOL.length)];
      var project = '07.2026 / ' + PROJECT_POOL[Math.floor(rnd()*PROJECT_POOL.length)] + ' / Объект ' + (i+1);
      var percentOpts = [100,100,100,60,50];
      var percent = percentOpts[Math.floor(rnd()*percentOpts.length)];
      var rate = Math.round((3000 + rnd()*45000)/10)*10;
      var paid = Math.round(rate*percent/100*10)/10;
      rows.push([date, contractor, project, percent, rate, paid, 0]);
    }
    rows.sort(function(a,b){ return parseRuDate(a[0]) - parseRuDate(b[0]); });
    return rows;
  }

  var DATA = {};
  EMPLOYEES.forEach(function(e){
    DATA[e.name] = (e.name === 'Потапов Денис') ? POTAPOV_ROWS.slice() : mockRowsFor(e.name);
  });
  var EXTRA = { 'Потапов Денис': {benzin:19500, auto:0, shtraf:0, rashod:4400, premia:0} };

  /* ---------------- Date helpers ---------------- */
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var DOW = ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];

  function parseRuDate(str){
    if(!str) return null;
    var p = str.split('.');
    if(p.length!==3) return null;
    return new Date(parseInt(p[2],10), parseInt(p[1],10)-1, parseInt(p[0],10));
  }
  function formatRuDate(d){
    var dd = ('0'+d.getDate()).slice(-2);
    var mm = ('0'+(d.getMonth()+1)).slice(-2);
    return dd+'.'+mm+'.'+d.getFullYear();
  }
  function sameDay(a,b){ return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function isWeekend(d){ var w=d.getDay(); return w===0||w===6; }

  /* ---------------- Toast ---------------- */
  function toast(msg, ok){
    var wrap = document.getElementById('toastWrap');
    var el = document.createElement('div');
    el.className = 'toast' + (ok?' success':'');
    el.innerHTML = (ok? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>':'') + '<span>'+msg+'</span>';
    wrap.appendChild(el);
    setTimeout(function(){ el.style.opacity='0'; el.style.transform='translateY(-8px)'; el.style.transition='.2s'; setTimeout(function(){ el.remove(); }, 200); }, 2200);
  }

  /* ---------------- Employee dropdown ---------------- */
  var empBtn = document.getElementById('empBtn');
  var empBtnLabel = document.getElementById('empBtnLabel');
  var empPanel = document.getElementById('empPanel');
  var empList = document.getElementById('empList');
  var empSearch = document.getElementById('empSearch');
  var selectedEmployee = null;

  function avatarHtml(emp, size){
    return '<div class="avatar'+(size==='sm'?' sm':'')+'" style="background:'+emp.color+'">'+emp.initials+'</div>';
  }

  function renderEmpList(filter){
    filter = (filter||'').toLowerCase().trim();
    var items = EMPLOYEES.filter(function(e){ return e.name.toLowerCase().indexOf(filter) !== -1; });
    if(items.length===0){ empList.innerHTML = '<div class="emp-empty">Никого не найдено</div>'; return; }
    empList.innerHTML = items.map(function(e){
      var active = selectedEmployee && selectedEmployee.name===e.name;
      return '<div class="emp-item'+(active?' active':'')+'" data-name="'+e.name+'">'+
        avatarHtml(e,'sm')+'<span>'+e.name+'</span>'+
        '<svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'+
      '</div>';
    }).join('');
  }

  function openEmpPanel(){
    renderEmpList(empSearch.value);
    empPanel.classList.add('show');
    empBtn.classList.add('open');
    closeAllCalendars();
  }
  function closeEmpPanel(){
    empPanel.classList.remove('show');
    empBtn.classList.remove('open');
  }
  empBtn.addEventListener('click', function(e){
    e.stopPropagation();
    empPanel.classList.contains('show') ? closeEmpPanel() : openEmpPanel();
  });
  empSearch.addEventListener('input', function(){ renderEmpList(empSearch.value); });
  empSearch.addEventListener('click', function(e){ e.stopPropagation(); });
  empList.addEventListener('click', function(e){
    var item = e.target.closest('.emp-item');
    if(!item) return;
    var emp = EMPLOYEES.find(function(x){ return x.name === item.getAttribute('data-name'); });
    selectedEmployee = emp;
    empBtnLabel.className = '';
    empBtnLabel.textContent = '';
    empBtn.querySelectorAll('.avatar').forEach(function(a){a.remove();});
    var av = document.createElement('div');
    av.className='avatar sm'; av.style.background=emp.color; av.textContent=emp.initials;
    empBtn.insertBefore(av, empBtnLabel);
    empBtnLabel.textContent = emp.name;
    closeEmpPanel();
  });

  /* ---------------- Calendars ---------------- */
  var dateFromInput = document.getElementById('dateFrom');
  var dateToInput = document.getElementById('dateTo');
  var calFromPop = document.getElementById('calFrom');
  var calToPop = document.getElementById('calTo');

  // Generic calendar: renders into popEl, calls onPick(dateObj) when a day is chosen.
  function buildCalendar(popEl, initial, onPick){
    var view = initial ? new Date(initial.getFullYear(), initial.getMonth(), 1) : new Date(2026,6,1);
    var selected = initial || null;

    function render(){
      var today = new Date();
      var y = view.getFullYear(), m = view.getMonth();
      var first = new Date(y,m,1);
      var startOffset = (first.getDay()+6)%7; // Monday=0
      var daysInMonth = new Date(y,m+1,0).getDate();
      var daysInPrev = new Date(y,m,0).getDate();

      var html = '<div class="cal-head">' +
        '<button type="button" class="cal-nav" data-nav="-1">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>' +
        '<div class="cal-title">'+MONTHS_NOM[m]+', '+y+'</div>' +
        '<button type="button" class="cal-nav" data-nav="1">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>' +
      '</div><div class="cal-grid">';

      DOW.forEach(function(d){ html += '<div class="cal-dow">'+d+'</div>'; });

      for(var i=0;i<startOffset;i++){
        var dnum = daysInPrev - startOffset + i + 1;
        html += '<div class="cal-day muted">'+dnum+'</div>';
      }
      for(var d=1; d<=daysInMonth; d++){
        var thisDate = new Date(y,m,d);
        var cls = 'cal-day';
        if(isWeekend(thisDate)) cls += ' weekend';
        if(sameDay(thisDate, today)) cls += ' today';
        if(selected && sameDay(thisDate, selected)) cls += ' selected';
        html += '<div class="'+cls+'" data-d="'+d+'">'+d+'</div>';
      }
      var totalCells = startOffset + daysInMonth;
      var trailing = (7 - (totalCells % 7)) % 7;
      for(var t=1; t<=trailing; t++){
        html += '<div class="cal-day muted">'+t+'</div>';
      }
      html += '</div><div class="cal-foot"><button type="button" class="cal-today-btn">Сегодня</button></div>';
      popEl.innerHTML = html;

      popEl.querySelectorAll('[data-nav]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          view.setMonth(view.getMonth() + parseInt(btn.getAttribute('data-nav'),10));
          render();
        });
      });
      popEl.querySelectorAll('.cal-day[data-d]').forEach(function(dEl){
        dEl.addEventListener('click', function(e){
          e.stopPropagation();
          selected = new Date(y,m,parseInt(dEl.getAttribute('data-d'),10));
          onPick(selected);
          render();
        });
      });
      popEl.querySelector('.cal-today-btn').addEventListener('click', function(e){
        e.stopPropagation();
        var t = new Date();
        view = new Date(t.getFullYear(), t.getMonth(), 1);
        selected = t;
        onPick(t);
        render();
      });
    }

    function open(){
      render();
      popEl.classList.add('show');
    }
    function close(){
      popEl.classList.remove('show');
    }
    function setSelected(d){
      selected = d;
      if(d) view = new Date(d.getFullYear(), d.getMonth(), 1);
    }
    return { open: open, close: close, render: render, setSelected: setSelected, el: popEl };
  }

  var calendars = [];
  function closeAllCalendars(){ calendars.forEach(function(c){ c.close(); }); }

  var calFrom = buildCalendar(calFromPop, parseRuDate('01.07.2026'), function(d){
    dateFromInput.value = formatRuDate(d);
    calFrom.close();
    dateFromInput.classList.remove('focus');
  });
  var calTo = buildCalendar(calToPop, parseRuDate('31.08.2026'), function(d){
    dateToInput.value = formatRuDate(d);
    calTo.close();
    dateToInput.classList.remove('focus');
  });
  calendars.push(calFrom, calTo);
  dateFromInput.value = '01.07.2026';
  dateToInput.value = '31.08.2026';

  dateFromInput.addEventListener('click', function(e){
    e.stopPropagation();
    var wasOpen = calFromPop.classList.contains('show');
    closeAllCalendars(); closeEmpPanel();
    if(wasOpen) return;
    calFrom.setSelected(parseRuDate(dateFromInput.value));
    calFrom.open();
    dateFromInput.classList.add('focus');
  });
  dateToInput.addEventListener('click', function(e){
    e.stopPropagation();
    var wasOpen = calToPop.classList.contains('show');
    closeAllCalendars(); closeEmpPanel();
    if(wasOpen) return;
    calTo.setSelected(parseRuDate(dateToInput.value));
    calTo.open();
    dateToInput.classList.add('focus');
  });

  document.addEventListener('click', function(){
    closeAllCalendars();
    closeEmpPanel();
    dateFromInput.classList.remove('focus');
    dateToInput.classList.remove('focus');
  });

  /* ---------------- Table rendering ---------------- */
  var tbody = document.getElementById('tbody');
  var emptyState = document.getElementById('emptyState');
  var summaryCard = document.getElementById('summaryCard');
  var resultTools = document.getElementById('resultTools');
  var currentRows = [];

  function rowHtml(r, idx){
    return '<tr data-idx="'+idx+'">' +
      '<td><div class="cell-pad"><span class="date-cell" data-row-date="'+idx+'">'+r[0]+'</span></div></td>' +
      '<td><div class="cell-pad"><input class="cell-input" readonly value="'+r[1]+'" data-field="1" data-idx="'+idx+'"></div></td>' +
      '<td><div class="cell-pad">' +
        '<input class="cell-input proj-text" readonly value="'+r[2]+'" data-field="2" data-idx="'+idx+'" title="'+r[2]+'">' +
        '<svg class="link-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>' +
      '</div></td>' +
      '<td><div class="cell-pad"><span class="emp-name">'+(selectedEmployee?selectedEmployee.name:'')+'</span></div></td>' +
      '<td class="num"><div class="cell-pad"><div class="percent-wrap"><input class="cell-input num" readonly value="'+r[3]+'" data-field="3" data-idx="'+idx+'"><span class="percent-sign">%</span></div></div></td>' +
      '<td class="num"><div class="cell-pad"><input class="cell-input num" readonly value="'+fmt1(r[4])+'" data-field="4" data-idx="'+idx+'"></div></td>' +
      '<td class="num"><div class="cell-pad"><input class="cell-input num" readonly value="'+fmt1(r[5])+'" data-field="5" data-idx="'+idx+'"></div></td>' +
      '<td class="num"><div class="cell-pad"><input class="cell-input num" readonly value="'+fmt1(r[6])+'" data-field="6" data-idx="'+idx+'"></div></td>' +
      '<td><div class="cell-pad"><button class="row-x" data-remove="'+idx+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div></td>' +
    '</tr>';
  }

  function renderTable(){
    if(currentRows.length === 0){
      tbody.innerHTML = '';
      emptyState.style.display = 'block';
      summaryCard.style.display = 'none';
      resultTools.style.display = 'none';
      return;
    }
    emptyState.style.display = 'none';
    summaryCard.style.display = 'block';
    resultTools.style.display = 'flex';
    tbody.innerHTML = currentRows.map(rowHtml).join('');
    updateTotals();
  }

  function updateTotals(){
    var sumRate=0, sumPaid=0, sumRem=0;
    currentRows.forEach(function(r){ sumRate+=r[4]; sumPaid+=r[5]; sumRem+=r[6]; });
    document.getElementById('gtRate').textContent = fmt1(sumRate);
    document.getElementById('gtRem').textContent = fmt1(sumRem);
    document.getElementById('gtPaid').textContent = fmt1(sumPaid);
  }

  /* ---------------- Column sorting ---------------- */
  var sortState = { key: null, dir: 1 };
  var sortHeaders = Array.prototype.slice.call(document.querySelectorAll('thead th.sortable'));

  function updateSortIndicators(){
    sortHeaders.forEach(function(th){
      var key = parseInt(th.getAttribute('data-sort'),10);
      var ico = th.querySelector('.sort-ico');
      if(sortState.key === key){
        th.classList.add('sort-active');
        ico.textContent = sortState.dir === 1 ? '↑' : '↓';
      } else {
        th.classList.remove('sort-active');
        ico.textContent = '↕';
      }
    });
  }

  document.querySelector('thead').addEventListener('click', function(e){
    var th = e.target.closest('th.sortable');
    if(!th) return;
    var key = parseInt(th.getAttribute('data-sort'),10);
    if(sortState.key === key){ sortState.dir *= -1; } else { sortState.key = key; sortState.dir = 1; }
    currentRows.sort(function(a,b){
      var av = a[key], bv = b[key];
      if(key === 0){ av = parseRuDate(av); bv = parseRuDate(bv); return ((av && av.getTime()) - (bv && bv.getTime())) * sortState.dir; }
      if(typeof av === 'string'){ return av.localeCompare(bv, 'ru') * sortState.dir; }
      return (av - bv) * sortState.dir;
    });
    renderTable();
    updateSortIndicators();
  });

  // Click-to-edit behaviour
  tbody.addEventListener('click', function(e){
    var input = e.target.closest('.cell-input');
    if(input && input.hasAttribute('readonly')){
      input.removeAttribute('readonly');
      input.classList.add('editing');
      input.focus();
      input.select();
    }
    var dateSpan = e.target.closest('[data-row-date]');
    if(dateSpan){
      e.stopPropagation();
      openRowDatePicker(dateSpan);
    }
    var removeBtn = e.target.closest('[data-remove]');
    if(removeBtn){
      var idx = parseInt(removeBtn.getAttribute('data-remove'),10);
      currentRows.splice(idx,1);
      renderTable();
    }
  });

  tbody.addEventListener('focusout', function(e){
    var input = e.target.closest('.cell-input');
    if(!input) return;
    commitCell(input);
  });
  tbody.addEventListener('keydown', function(e){
    var input = e.target.closest('.cell-input');
    if(!input) return;
    if(e.key === 'Enter'){ input.blur(); }
    if(e.key === 'Escape'){ input.blur(); }
  });

  // Commits a single cell in place — deliberately does NOT rebuild the table.
  // (Rebuilding tbody.innerHTML on every blur used to swap out the DOM node the
  // next click was landing on, which is why a click right after editing another
  // cell needed to happen twice. Updating just this cell + the totals keeps every
  // other row's DOM untouched, so the very next click always lands correctly.)
  function commitCell(input){
    var idx = parseInt(input.getAttribute('data-idx'),10);
    var field = parseInt(input.getAttribute('data-field'),10);
    var row = currentRows[idx];
    if(row){
      if(field===1 || field===2){
        row[field] = input.value.trim() || row[field];
      } else {
        row[field] = parseNum(input.value);
      }
      if(field===3 || field===4){
        row[5] = Math.round(row[4]*row[3]/100*10)/10;
      }
      // Reflect the (possibly reformatted) value back into this input.
      input.value = (field===1 || field===2 || field===3) ? row[field] : fmt1(row[field]);
      if(field===2){ input.title = row[2]; }
      // If % or rate changed, the paid cell in this same row needs refreshing too.
      if(field===3 || field===4){
        var tr = input.closest('tr');
        var paidInput = tr && tr.querySelector('input[data-field="5"]');
        if(paidInput) paidInput.value = fmt1(row[5]);
      }
    }
    input.setAttribute('readonly','');
    input.classList.remove('editing');
    updateTotals();
  }

  // Row date pop-up: a floating calendar anchored to the clicked date cell
  var rowCalPop = null, rowCalCleanup = null;
  function closeRowDatePicker(){
    if(rowCalPop){ rowCalPop.remove(); rowCalPop = null; }
    if(rowCalCleanup){ document.removeEventListener('click', rowCalCleanup); rowCalCleanup = null; }
  }
  function openRowDatePicker(span){
    closeRowDatePicker();
    closeAllCalendars();
    closeEmpPanel();
    var idx = parseInt(span.getAttribute('data-row-date'),10);
    var pop = document.createElement('div');
    pop.className = 'cal-pop';
    pop.style.position = 'fixed';
    var rect = span.getBoundingClientRect();
    pop.style.top = (rect.bottom + 8) + 'px';
    pop.style.left = rect.left + 'px';
    document.body.appendChild(pop);
    rowCalPop = pop;

    var cal = buildCalendar(pop, parseRuDate(currentRows[idx][0]) || new Date(2026,6,1), function(d){
      currentRows[idx][0] = formatRuDate(d);
      closeRowDatePicker();
      renderTable();
    });
    cal.open();

    rowCalCleanup = function(ev){
      if(!pop.contains(ev.target) && ev.target !== span){ closeRowDatePicker(); }
    };
    setTimeout(function(){ document.addEventListener('click', rowCalCleanup); }, 0);
  }

  /* ---------------- Money-formatted extra fields (Бензин/Авто/Штраф/Расходники/Премия) ---------------- */
  function fmtMoney(n){
    n = parseNum(n);
    if(!n) return '';
    var isInt = Math.round(n*100)/100 % 1 === 0;
    var parts = n.toFixed(isInt ? 0 : 2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return parts.join(',');
  }
  ['fBenzin','fAuto','fShtraf','fRashod','fPremia'].forEach(function(id){
    var el = document.getElementById(id);
    el.addEventListener('focus', function(){
      var n = parseNum(el.value);
      el.value = n ? String(n).replace('.', ',') : '';
      el.select();
    });
    el.addEventListener('blur', function(){
      el.value = fmtMoney(el.value);
    });
  });
  function setMoneyField(id, value){
    var el = document.getElementById(id);
    el.value = fmtMoney(value);
  }

  /* ---------------- Search / toolbar actions ---------------- */
  document.getElementById('searchBtn').addEventListener('click', function(){
    if(!selectedEmployee){ toast('Выберите сотрудника'); return; }
    var from = parseRuDate(dateFromInput.value);
    var to = parseRuDate(dateToInput.value);
    var rows = (DATA[selectedEmployee.name] || []).filter(function(r){
      var d = parseRuDate(r[0]);
      if(from && d < from) return false;
      if(to && d > to) return false;
      return true;
    }).map(function(r){ return r.slice(); });
    currentRows = rows;
    sortState = { key: null, dir: 1 };
    renderTable();
    updateSortIndicators();

    var extra = EXTRA[selectedEmployee.name] || {benzin:0, auto:0, shtraf:0, rashod:0, premia:0};
    setMoneyField('fBenzin', extra.benzin);
    setMoneyField('fAuto', extra.auto);
    setMoneyField('fShtraf', extra.shtraf);
    setMoneyField('fRashod', extra.rashod);
    setMoneyField('fPremia', extra.premia);
  });

  document.getElementById('set50Btn').addEventListener('click', function(){
    currentRows.forEach(function(r){ r[3]=50; r[5]=Math.round(r[4]*0.5*10)/10; });
    renderTable();
    toast('Выполнение выставлено 50% для всех строк');
  });
  document.getElementById('set100Btn').addEventListener('click', function(){
    currentRows.forEach(function(r){ r[3]=100; r[5]=r[4]; });
    renderTable();
    toast('Выполнение выставлено 100% для всех строк');
  });

  document.getElementById('downloadBtn').addEventListener('click', function(){
    if(currentRows.length===0){ toast('Нет данных для скачивания'); return; }
    var header = ['Дата','Контрагент','Проект','Сотрудник','Выполнено %','Ставка','Выплачено','Остаток'];
    var lines = [header.join(';')];
    currentRows.forEach(function(r){
      lines.push([r[0], r[1], r[2], selectedEmployee.name, r[3], fmt1(r[4]), fmt1(r[5]), fmt1(r[6])].join(';'));
    });
    var blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'зарплата_'+(selectedEmployee?selectedEmployee.name.replace(/\s/g,'_'):'export')+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Файл скачан', true);
  });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

  document.getElementById('payBtn').addEventListener('click', function(){
    if(!selectedEmployee){ toast('Выберите сотрудника'); return; }
    toast('Зарплата выплачена — '+selectedEmployee.name, true);
  });

  /* ---------------- Init: preselect Потапов Денис and auto-search ---------------- */
  (function init(){
    var emp = EMPLOYEES.find(function(e){ return e.name === 'Потапов Денис'; });
    selectedEmployee = emp;
    var av = document.createElement('div');
    av.className='avatar sm'; av.style.background=emp.color; av.textContent=emp.initials;
    empBtn.insertBefore(av, empBtnLabel);
    empBtnLabel.className = '';
    empBtnLabel.textContent = emp.name;
    document.getElementById('searchBtn').click();
  })();

})();
</script>
</body>
</html>
